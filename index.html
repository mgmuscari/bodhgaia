<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," /><!-- replaced at boot by a painted house tile (main.ts setPixelFavicon) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bodhitropolis</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--ui-ink);
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* UI kit (uiTheme.ts): every frame is a palette 9-slice drawn at whole-pixel scale */
      body {
        image-rendering: pixelated;
        font-family: var(--ui-font);
        -webkit-font-smoothing: none;
      }
      button, select, input {
        font-family: var(--ui-font);
      }

      /* Opening challenge overlay: dark panel on the var(--ui-ink) ground, meadow-gold
         accent (matches renderer PALETTE.meadow), monospace pixel feel. */
      .opening-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(24, 24, 40, 0.72);
        z-index: 10;
        font-family: var(--ui-font);
        color: var(--ui-text);
      }
      .opening-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        box-sizing: border-box;
        max-width: 46rem;
        max-height: 88vh;
        overflow-y: auto;
        margin: 1.5rem;
        padding: 1.75rem 2rem;
        line-height: 1.5;
      }
      .opening-name {
        margin: 0 0 0.75rem;
        font-size: 2rem;
        letter-spacing: 0.04em;
        color: var(--ui-accent);
        text-shadow: 2px 2px 0 var(--ui-ink);
      }
      .opening-eras {
        margin: 0 0 1rem;
        padding: 0.75rem 0;
        border-top: 1px solid var(--ui-panel-hi);
        border-bottom: 1px solid var(--ui-panel-hi);
        font-size: 1.0rem;
        color: var(--ui-muted);
      }
      .opening-eras p {
        margin: 0.2rem 0;
      }
      .opening-stats {
        margin: 0 0 1rem;
        color: var(--ui-text);
      }
      .opening-stats p {
        margin: 0.25rem 0;
      }
      .opening-challenge p {
        margin: 0.6rem 0;
        color: var(--ui-text);
      }
      .opening-begin {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        margin-top: 1.25rem;
        padding: 0.6rem 1.6rem;
        font: inherit;
        font-size: 1rem;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .opening-begin:hover,
      .opening-begin:focus {
        background: var(--ui-accent);
        outline: 2px solid var(--ui-text);
        outline-offset: 2px;
      }

      /* Tech panel: right-docked over the live map, toggled by T. Palette matches
         the opening overlay (var(--ui-panel) panel, var(--ui-accent) meadow border). Internal
         scroll keeps all seven branch columns reachable on short viewports. */
      /* Tech TREE: a large centered overlay (Civ-style) over the live map, toggled
         by T. Roots on the left, each tech right of its prereqs, connector lines
         beneath. 2D-scrolls within the panel when the tree is bigger than the view. */
      .tech-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        inset: 4vh 3vw;
        z-index: 9;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        font-family: var(--ui-font);
        color: var(--ui-text);
      }
      .tech-panel[hidden] {
        display: none;
      }
      .tech-panel-header {
        flex: 0 0 auto;
        padding: 0.85rem 1.25rem;
        background: var(--ui-panel);
        border-bottom: 1px solid var(--ui-panel-hi);
        font-size: 1.05rem;
        letter-spacing: 0.03em;
        color: var(--ui-accent);
      }
      .tech-tree-wrap {
        flex: 1 1 auto;
        overflow: auto;
        padding: 0.5rem;
      }
      .tech-tree {
        position: relative;
      }
      .tech-edges {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .tech-edge {
        stroke: var(--ui-panel-hi);
        stroke-width: 2;
      }
      .tech-edge-active {
        stroke: var(--ui-good);
        stroke-width: 2.5;
      }
      .tech-node {
        box-sizing: border-box;
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--ui-panel-hi);
        border-radius: 2px;
        background: var(--ui-panel);
      }
      .tech-node-name {
        font-size: 1.0rem;
      }
      .tech-node-flavor {
        margin-top: 0.18rem;
        font-size: 1.0rem;
        color: var(--ui-muted);
      }
      .tech-node-missing {
        margin-top: 0.18rem;
        font-size: 1.0rem;
        color: var(--ui-bad);
      }
      .tech-node-locked {
        opacity: 0.55;
      }
      .tech-node-affordable {
        border-color: var(--ui-accent);
        background: var(--ui-panel);
      }
      .tech-node-clickable {
        cursor: pointer;
      }
      .tech-node-clickable:hover {
        background: var(--ui-panel-hi);
      }
      .tech-node-unlocked {
        border-color: var(--ui-good);
        color: var(--ui-good);
      }

      /* Tool dock: always-on bottom bar over the live map. Palette matches the
         tech panel (var(--ui-panel) panel, var(--ui-accent) meadow border, var(--ui-accent) selection).
         Sits below the tech panel (z 9) and the opening overlay (z 10). */
      .toolbar {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        z-index: 8;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        max-width: 96vw;
        padding: 0.5rem 0.75rem;
        border-bottom: none;
        font-family: var(--ui-font);
      }
      .toolbar-tools {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.4rem;
      }
      .toolbar-status {
        max-width: 100%;
        font-size: 1.0rem;
        letter-spacing: 0.02em;
        color: var(--ui-muted);
        text-align: center;
      }
      .toolbar-status[hidden] {
        display: none;
      }
      .toolbar-tool {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        padding: 0.35rem 0.7rem;
        font: inherit;
        font-size: 1.0rem;
        letter-spacing: 0.02em;
        cursor: pointer;
        white-space: nowrap;
      }
      .toolbar-tool:hover {
        filter: brightness(1.08);
      }
      .toolbar-tool-selected {
        border-image-source: var(--ui-frame-buttonDown);
        color: var(--ui-accent);
      }
      .toolbar-tool-unaffordable {
        opacity: 0.45;
      }

      /* Categorized dock (v2): top-level modes + category tiles in one row; the
         open category's tools in a flyout above. Pictorial icons + pixel labels. */
      /* Drag grip: the only surface that moves the dock (tool clicks must not). */
      .toolbar-grip {
        align-self: stretch;
        text-align: center;
        font-size: 1.0rem;
        letter-spacing: 0.18em;
        color: var(--ui-muted);
        cursor: move;
        user-select: none;
        padding: 0.1rem 0 0.25rem;
        margin-bottom: 0.1rem;
        border-bottom: 1px solid var(--ui-panel-hi);
      }
      .toolbar-grip:hover {
        color: var(--ui-accent);
      }
      .toolbar-main {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .toolbar-modes,
      .toolbar-cats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .toolbar-cats {
        padding-left: 0.5rem;
        border-left: 1px solid var(--ui-panel-hi);
      }
      .toolbar-flyout {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem;
        max-width: 94vw;
        padding-bottom: 0.4rem;
        margin-bottom: 0.1rem;
        border-bottom: 1px solid var(--ui-panel-hi);
      }
      .toolbar-flyout[hidden] {
        display: none;
      }
      .toolbar-mode,
      .toolbar-cat,
      .toolbar-flyitem {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        padding: 0.35rem 0.7rem;
        font: inherit;
        font-size: 1.0rem;
        letter-spacing: 0.02em;
        cursor: pointer;
        white-space: nowrap;
      }
      .toolbar-mode:hover,
      .toolbar-cat:hover,
      .toolbar-flyitem:hover {
        filter: brightness(1.08);
      }
      .toolbar-cat {
        font-size: 1.0rem;
      }
      .toolbar-mode-selected,
      .toolbar-cat-active,
      .toolbar-flyitem-selected {
        border-image-source: var(--ui-frame-buttonDown);
        color: var(--ui-text-dark);
      }
      /* A category that holds the selected tool but is closed: a quiet gold hint. */
      .toolbar-cat-hassel {
        border-color: var(--ui-accent);
      }
      .toolbar-flyitem-unaffordable {
        opacity: 0.45;
      }

      /* Dock meta row: [Tech (T)] [Eco (E)] [Civic (C)] — the keyboard-only depth
         surfaced as always-visible toggles, sitting in the dock below the tool row.
         Read as secondary controls (smaller, muted) until active, when they take the
         meadow-gold selection palette shared with .toolbar-tool-selected. */
      .toolbar-meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.4rem;
      }
      .toolbar-meta-button {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        padding: 0.28rem 0.6rem;
        font: inherit;
        font-size: 1.0rem;
        letter-spacing: 0.04em;
        cursor: pointer;
        white-space: nowrap;
      }
      .toolbar-meta-button:hover {
        filter: brightness(1.08);
      }
      .toolbar-meta-active {
        border-image-source: var(--ui-frame-buttonDown);
        color: var(--ui-accent);
      }

      /* Unlock flash: a ~1s meadow-gold pulse on the whole dock when the tech tree
         grants a new tool (added once by the shell, removed after the timeout). */
      @keyframes toolbar-flash {
        0% {
          border-color: var(--ui-accent);
          box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.45);
        }
        30% {
          border-color: var(--ui-accent);
          box-shadow: 0 0 20px 4px rgba(200, 194, 100, 0.85);
        }
        100% {
          border-color: var(--ui-accent);
          box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.45);
        }
      }
      .toolbar-tool-flash {
        animation: toolbar-flash 1s ease-out;
      }

      /* Wellbeing pulse: a thin always-on readout, top-center over the live map.
         Its own dedicated dock (never the toolbar status), refreshed on the civic
         cadence so it never flickers. Palette matches the docks. */
      .pulse-dock {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        z-index: 8;
        padding: 0.35rem 0.9rem;
        border-top: none;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        letter-spacing: 0.03em;
        color: var(--ui-text);
        white-space: nowrap;
      }
      .restoration-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        right: 0;
        top: 0;
        z-index: 8;
        padding: 0.4rem 0.8rem 0.55rem;
        border-top: none;
        border-right: none;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        letter-spacing: 0.02em;
        color: var(--ui-text);
      }
      .restoration-panel__title {
        font-weight: bold;
        color: var(--ui-accent);
        margin-bottom: 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1.0rem;
      }
      .restoration-panel__body {
        white-space: pre;
        line-height: 1.5;
      }
      .settings-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 11;
        min-width: 18rem;
        padding: 0.7rem 1rem 0.9rem;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        color: var(--ui-text);
      }
      .settings-panel__title {
        font-weight: bold;
        color: var(--ui-accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1.0rem;
        margin-bottom: 0.5rem;
      }
      .settings-panel__close {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        position: absolute;
        right: 0.5rem;
        top: 0.45rem;
        cursor: pointer;
        font-weight: bold;
      }
      .settings-panel__section {
        margin-top: 0.55rem;
        border-top: 1px solid rgba(150, 158, 74, 0.4);
        padding-top: 0.45rem;
      }
      .settings-panel__heading {
        color: var(--ui-muted);
        font-size: 1.0rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.35rem;
      }
      .settings-panel__row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        margin: 0.22rem 0;
      }
      .settings-panel button {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        font-family: inherit;
        font-size: 1.0rem;
        padding: 0.15rem 0.5rem;
        cursor: pointer;
      }
      .settings-panel button.is-active {
        border-image-source: var(--ui-frame-buttonDown);
        color: var(--ui-panel);
        font-weight: bold;
      }
      .settings-panel button:hover {
        filter: brightness(1.08);
      }
      .settings-panel select,
      .settings-panel input {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        font-family: inherit;
        font-size: 1.0rem;
        padding: 0.1rem 0.3rem;
      }
      .settings-panel__note {
        color: var(--ui-muted);
        font-size: 1.0rem;
        line-height: 1.4;
        margin-top: 0.3rem;
      }
      /* Always-visible controls hint (bottom-left) — the discoverable entry to the help panel. */
      .controls-hint {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: 0.6rem;
        bottom: 0.6rem;
        z-index: 9;
        padding: 0.3rem 0.6rem;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        letter-spacing: 0.03em;
        color: var(--ui-accent);
        cursor: pointer;
      }
      .controls-hint:hover {
        border-color: var(--ui-accent);
        color: var(--ui-accent);
      }
      .help-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 11;
        min-width: 16rem;
        padding: 0.7rem 1.1rem 0.9rem;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        color: var(--ui-text);
      }
      .help-panel__close {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        position: absolute;
        right: 0.5rem;
        top: 0.45rem;
        cursor: pointer;
        font-weight: bold;
      }
      .help-panel__title {
        font-weight: bold;
        color: var(--ui-accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1.0rem;
        margin-bottom: 0.5rem;
      }
      .help-panel__body {
        white-space: pre;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
