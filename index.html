<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," /><!-- replaced at boot by a painted house tile (main.ts setPixelFavicon) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bodhitropolis</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--ui-ink);
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* UI kit (uiTheme.ts): every frame is a palette 9-slice drawn at whole-pixel scale */
      body {
        image-rendering: pixelated;
        font-family: var(--ui-font);
        -webkit-font-smoothing: none;
      }
      button, select, input {
        font-family: var(--ui-font);
      }

      /* Opening challenge overlay: dark panel on the var(--ui-ink) ground, meadow-gold
         accent (matches renderer PALETTE.meadow), monospace pixel feel. */
      .opening-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(24, 24, 40, 0.72);
        z-index: 10;
        font-family: var(--ui-font);
        color: var(--ui-text);
      }
      .opening-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        box-sizing: border-box;
        max-width: 46rem;
        max-height: 88vh;
        overflow-y: auto;
        margin: 1.5rem;
        padding: 1.75rem 2rem;
        line-height: 1.5;
      }
      .opening-name {
        margin: 0 0 0.75rem;
        font-size: 2rem;
        letter-spacing: 0.04em;
        color: var(--ui-accent);
        text-shadow: 2px 2px 0 var(--ui-ink);
      }
      .opening-eras {
        margin: 0 0 1rem;
        padding: 0.75rem 0;
        border-top: 1px solid var(--ui-panel-hi);
        border-bottom: 1px solid var(--ui-panel-hi);
        font-size: 1.0rem;
        color: var(--ui-muted);
      }
      .opening-eras p {
        margin: 0.2rem 0;
      }
      .opening-stats {
        margin: 0 0 1rem;
        color: var(--ui-text);
      }
      .opening-stats p {
        margin: 0.25rem 0;
      }
      .opening-challenge p {
        margin: 0.6rem 0;
        color: var(--ui-text);
      }
      .opening-begin {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        margin-top: 1.25rem;
        padding: 0.6rem 1.6rem;
        font: inherit;
        font-size: 1rem;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .opening-begin:hover,
      .opening-begin:focus {
        background: var(--ui-accent);
        outline: 2px solid var(--ui-text);
        outline-offset: 2px;
      }

      /* Tech panel: right-docked over the live map, toggled by T. Palette matches
         the opening overlay (var(--ui-panel) panel, var(--ui-accent) meadow border). Internal
         scroll keeps all seven branch columns reachable on short viewports. */
      /* Tech TREE: a large centered overlay (Civ-style) over the live map, toggled
         by T. Roots on the left, each tech right of its prereqs, connector lines
         beneath. 2D-scrolls within the panel when the tree is bigger than the view. */
      .tech-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        inset: 4vh 3vw;
        z-index: 9;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        font-family: var(--ui-font);
        color: var(--ui-text);
      }
      .tech-panel[hidden] {
        display: none;
      }
      .tech-panel-header {
        flex: 0 0 auto;
        padding: 0.85rem 1.25rem;
        background: var(--ui-panel);
        border-bottom: 1px solid var(--ui-panel-hi);
        font-size: 1.05rem;
        letter-spacing: 0.03em;
        color: var(--ui-accent);
      }
      .tech-tree-wrap {
        flex: 1 1 auto;
        overflow: auto;
        padding: 0.5rem;
      }
      .tech-tree {
        position: relative;
      }
      .tech-edges {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .tech-edge {
        stroke: var(--ui-panel-hi);
        stroke-width: 2;
      }
      .tech-edge-active {
        stroke: var(--ui-good);
        stroke-width: 2.5;
      }
      .tech-node {
        box-sizing: border-box;
        padding: 0.4rem 0.55rem;
        border: 1px solid var(--ui-panel-hi);
        border-radius: 2px;
        background: var(--ui-panel);
      }
      .tech-node-name {
        font-size: 1.0rem;
      }
      .tech-node-flavor {
        margin-top: 0.18rem;
        font-size: 1.0rem;
        color: var(--ui-muted);
      }
      .tech-node-missing {
        margin-top: 0.18rem;
        font-size: 1.0rem;
        color: var(--ui-bad);
      }
      .tech-node-locked {
        opacity: 0.55;
      }
      .tech-node-affordable {
        border-color: var(--ui-accent);
        background: var(--ui-panel);
      }
      .tech-node-clickable {
        cursor: pointer;
      }
      .tech-node-clickable:hover {
        background: var(--ui-panel-hi);
      }
      .tech-node-unlocked {
        border-color: var(--ui-good);
        color: var(--ui-good);
      }

      /* Tool palette: docked down the left edge, SNES SimCity style; the map pane starts right of it
         (main.ts sizes the canvases to the remaining width). Icon buttons in a 2-column grid. */
      .toolbar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--sidebar-w);
        box-sizing: border-box;
        z-index: 8;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 0;
        overflow-y: auto;
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
      }
      .toolbar-grid {
        display: grid;
        grid-template-columns: repeat(2, 44px);
        gap: 0;
      }
      .toolbar-rule {
        width: 80%;
        height: 2px;
        background: var(--ui-panel-hi);
        flex: 0 0 auto;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: 6px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 6px stretch;
        background: none;
      }
      .icon-btn canvas {
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
      }
      .icon-btn:hover {
        filter: brightness(1.1);
      }
      .icon-btn.is-selected,
      .icon-btn.is-open {
        border-image-source: var(--ui-frame-buttonDown);
      }
      .icon-btn.is-unaffordable canvas {
        opacity: 0.4;
      }
      /* A category's tools, beside the palette */
      .toolbar-flyout {
        position: fixed;
        left: var(--sidebar-w);
        z-index: 8;
        display: grid;
        grid-template-columns: repeat(4, 44px);
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
      }
      .toolbar-flyout[hidden] {
        display: none;
      }
      /* Status line (inspect readouts, legend captions): along the bottom of the map pane */
      .toolbar-status {
        position: fixed;
        left: var(--sidebar-w);
        right: 0;
        bottom: 0;
        z-index: 8;
        padding: 2px 8px;
        color: var(--ui-text);
        font-size: 1rem;
        border: 8px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 8px stretch;
      }
      .toolbar-status[hidden] {
        display: none;
      }
      .ui-tip {
        position: fixed;
        z-index: 20;
        pointer-events: none;
        padding: 0 4px;
        color: var(--ui-text-dark);
        font-size: 1rem;
        white-space: nowrap;
        border: 6px solid transparent;
        border-image: var(--ui-frame-tooltip) 4 fill / 6px stretch;
      }
      .ui-tip[hidden] {
        display: none;
      }
      /* Unlock flash: a short gold pulse on the palette when the commons unlocks a tool */
      @keyframes toolbar-flash {
        0%, 100% { filter: none; }
        40% { filter: brightness(1.35) drop-shadow(0 0 6px var(--ui-accent)); }
      }
      .toolbar-tool-flash {
        animation: toolbar-flash 1s steps(6);
      }

      /* Wellbeing pulse: a thin always-on readout, top-center over the live map.
         Its own dedicated dock (never the toolbar status), refreshed on the civic
         cadence so it never flickers. Palette matches the docks. */
      .pulse-dock {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: calc(var(--sidebar-w) + (100vw - var(--sidebar-w)) / 2); /* centred over the map pane */
        top: 0;
        transform: translateX(-50%);
        z-index: 8;
        padding: 0.35rem 0.9rem;
        border-top: none;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        letter-spacing: 0.03em;
        color: var(--ui-text);
        white-space: nowrap;
      }
      .restoration-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        right: 0;
        top: 0;
        z-index: 8;
        padding: 0.4rem 0.8rem 0.55rem;
        border-top: none;
        border-right: none;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        letter-spacing: 0.02em;
        color: var(--ui-text);
      }
      .restoration-panel__title {
        font-weight: bold;
        color: var(--ui-accent);
        margin-bottom: 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1.0rem;
      }
      .restoration-panel__body {
        white-space: pre;
        line-height: 1.5;
      }
      .settings-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 11;
        min-width: 18rem;
        padding: 0.7rem 1rem 0.9rem;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        color: var(--ui-text);
      }
      .settings-panel__title {
        font-weight: bold;
        color: var(--ui-accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1.0rem;
        margin-bottom: 0.5rem;
      }
      .settings-panel__close {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        position: absolute;
        right: 0.5rem;
        top: 0.45rem;
        cursor: pointer;
        font-weight: bold;
      }
      .settings-panel__section {
        margin-top: 0.55rem;
        border-top: 1px solid rgba(150, 158, 74, 0.4);
        padding-top: 0.45rem;
      }
      .settings-panel__heading {
        color: var(--ui-muted);
        font-size: 1.0rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.35rem;
      }
      .settings-panel__row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        margin: 0.22rem 0;
      }
      .settings-panel button {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        font-family: inherit;
        font-size: 1.0rem;
        padding: 0.15rem 0.5rem;
        cursor: pointer;
      }
      .settings-panel button.is-active {
        border-image-source: var(--ui-frame-buttonDown);
        color: var(--ui-panel);
        font-weight: bold;
      }
      .settings-panel button:hover {
        filter: brightness(1.08);
      }
      .settings-panel select,
      .settings-panel input {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        font-family: inherit;
        font-size: 1.0rem;
        padding: 0.1rem 0.3rem;
      }
      .settings-panel__note {
        color: var(--ui-muted);
        font-size: 1.0rem;
        line-height: 1.4;
        margin-top: 0.3rem;
      }
      /* Always-visible controls hint (bottom-left) — the discoverable entry to the help panel. */
      .controls-hint {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: 0.6rem;
        bottom: 0.6rem;
        z-index: 9;
        padding: 0.3rem 0.6rem;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        letter-spacing: 0.03em;
        color: var(--ui-accent);
        cursor: pointer;
      }
      .controls-hint:hover {
        border-color: var(--ui-accent);
        color: var(--ui-accent);
      }
      .help-panel {
        border: 12px solid transparent;
        border-image: var(--ui-frame-panel) 4 fill / 12px stretch;
        background: none;
        box-shadow: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 11;
        min-width: 16rem;
        padding: 0.7rem 1.1rem 0.9rem;
        font-family: var(--ui-font);
        font-size: 1.0rem;
        color: var(--ui-text);
      }
      .help-panel__close {
        border: 8px solid transparent;
        border-image: var(--ui-frame-button) 4 fill / 8px stretch;
        background: none;
        color: var(--ui-text-dark);
        position: absolute;
        right: 0.5rem;
        top: 0.45rem;
        cursor: pointer;
        font-weight: bold;
      }
      .help-panel__title {
        font-weight: bold;
        color: var(--ui-accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1.0rem;
        margin-bottom: 0.5rem;
      }
      .help-panel__body {
        white-space: pre;
        line-height: 1.6;
      }
      /* The palette's Help icon replaces the floating controls hint */
      .controls-hint {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
